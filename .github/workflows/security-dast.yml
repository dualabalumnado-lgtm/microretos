name: Security DAST — OWASP ZAP

on:
  push:
    branches: ['**']
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  dast:
    name: DAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ─── 1. CHECKOUT ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. SETUP NODE ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --prefer-offline || npm install

      # ─── 3. SETUP PHP ──────────────────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # ─── 4. PREPARAR ENTORNO ───────────────────────────────────────────────
      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # ─── 5. ARRANCAR APP ───────────────────────────────────────────────────
      - name: Start application
        run: php artisan serve --port=8000 &

      - name: Wait for app to be ready
        run: |
          echo "Esperando a que la app esté disponible..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000 > /dev/null; then
              echo "App lista"
              exit 0
            fi
            echo "Intento $i..."
            sleep 3
          done
          echo "Timeout: la app no arrancó"
          exit 1

      # ─── 6. ZAP SCAN ───────────────────────────────────────────────────────
      - name: OWASP ZAP Baseline Scan
        run: |
          docker run --network host \
            -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8000 \
            -r /zap/wrk/zap-report.html \
            -J /zap/wrk/zap-report.json \
            -I
        continue-on-error: true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: |
            zap-report.html
            zap-report.json

      # ─── 7. JOB SUMMARY ────────────────────────────────────────────────────
      - name: Write Job Summary
        if: always()
        run: |
          echo "## DAST — OWASP ZAP Results" >> $GITHUB_STEP_SUMMARY
          echo "| Herramienta | Categoría | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| OWASP ZAP Baseline | DAST / Runtime | Completado |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⬇ Descarga el reporte HTML en la sección _Artifacts_." >> $GITHUB_STEP_SUMMARY
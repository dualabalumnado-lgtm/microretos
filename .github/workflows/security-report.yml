name: Security Static Analysis

on:
  push:
  workflow_dispatch:

jobs:
  security-analysis:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      # ─── 1. CHECKOUT ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── 2. SETUP NODE ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --prefer-offline || npm install
        continue-on-error: true

      # ─── 3. GITLEAKS ───────────────────────────────────────────────────────
      - name: Gitleaks — Detect secrets in code
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --report-format json --report-path gitleaks-report.json
        continue-on-error: true

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json

      # ─── 4. SONARQUBE ──────────────────────────────────────────────────────
      - name: Start SonarQube
        run: |
          docker run -d --name sonarqube -p 9000:9000 sonarqube:community
          echo "Esperando a que SonarQube arranque..."
          until curl -s http://localhost:9000/api/system/status | grep -q '"status":"UP"'; do
            sleep 5
          done
          echo "SonarQube listo"

      - name: Generate SonarQube token via API
        run: |
          curl -s -u "${{ secrets.SONAR_ADMIN_DEFAULT }}:${{ secrets.SONAR_ADMIN_DEFAULT }}" -X POST \
            "http://localhost:9000/api/users/change_password" \
            -d "login=${{ secrets.SONAR_ADMIN_DEFAULT }}&previousPassword=${{ secrets.SONAR_ADMIN_DEFAULT }}&password=${{ secrets.SONAR_ADMIN_PASSWORD }}"

          TOKEN=$(curl -s -u "${{ secrets.SONAR_ADMIN_DEFAULT }}:${{ secrets.SONAR_ADMIN_PASSWORD }}" -X POST \
            "http://localhost:9000/api/user_tokens/generate" \
            -d "name=ci-token" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")

          echo "SONAR_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "SONAR_HOST_URL=http://localhost:9000" >> $GITHUB_ENV
          echo "SONAR_PROJECT_KEY=dualab" >> $GITHUB_ENV

      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**,vendor/**,public/build/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
        continue-on-error: true

      - name: Export SonarQube results
        if: always()
        run: |
          TASK_ID=$(curl -s -u "${{ secrets.SONAR_ADMIN_DEFAULT }}:${{ secrets.SONAR_ADMIN_PASSWORD }}" \
            "http://localhost:9000/api/ce/component?component=dualab" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['current']['id'])")

          echo "Esperando a que SonarQube termine de procesar..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -u "${{ secrets.SONAR_ADMIN_DEFAULT }}:${{ secrets.SONAR_ADMIN_PASSWORD }}" \
              "http://localhost:9000/api/ce/task?id=$TASK_ID" | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print(d['task']['status'])")
            echo "Estado: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              break
            fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "La tarea de SonarQube falló"
              exit 1
            fi
            sleep 5
          done

          curl -s -u "${{ secrets.SONAR_ADMIN_DEFAULT }}:${{ secrets.SONAR_ADMIN_PASSWORD }}" \
            "http://localhost:9000/api/issues/search?projectKeys=dualab&types=VULNERABILITY,BUG,CODE_SMELL&ps=500&additionalFields=comments,rules,transitions" \
            > sonar-issues.json

          curl -s -u "${{ secrets.SONAR_ADMIN_DEFAULT }}:${{ secrets.SONAR_ADMIN_PASSWORD }}" \
            "http://localhost:9000/api/measures/component?component=dualab&metricKeys=bugs,vulnerabilities,code_smells,security_hotspots,coverage,duplicated_lines_density,ncloc,sqale_rating,reliability_rating,security_rating" \
            > sonar-metrics.json

          curl -s -u "${{ secrets.SONAR_ADMIN_DEFAULT }}:${{ secrets.SONAR_ADMIN_PASSWORD }}" \
            "http://localhost:9000/api/hotspots/search?projectKey=dualab&ps=500" \
            > sonar-hotspots.json

      - name: Generate SonarQube full report
        if: always()
        run: |
          python3 << 'EOF' > sonar-full-report.txt
          import json

          print("=" * 60)
          print("SONARQUBE ANALYSIS REPORT")
          print("=" * 60)

          try:
              m = json.load(open("sonar-metrics.json"))
              measures = {x["metric"]: x.get("value", "N/A") for x in m.get("component", {}).get("measures", [])}
              print("\n MÉTRICAS GENERALES:")
              print(f"  Bugs:              {measures.get('bugs', 'N/A')}")
              print(f"  Vulnerabilidades:  {measures.get('vulnerabilities', 'N/A')}")
              print(f"  Code Smells:       {measures.get('code_smells', 'N/A')}")
              print(f"  Security Hotspots: {measures.get('security_hotspots', 'N/A')}")
              print(f"  Cobertura:         {measures.get('coverage', 'N/A')}%")
              print(f"  Duplicaciones:     {measures.get('duplicated_lines_density', 'N/A')}%")
              print(f"  Líneas de código:  {measures.get('ncloc', 'N/A')}")
          except Exception as e:
              print(f"No se pudieron leer las métricas: {e}")

          try:
              issues = json.load(open("sonar-issues.json")).get("issues", [])
              print(f"\n ISSUES ENCONTRADOS ({len(issues)} total):")
              for i in issues:
                  print(f"\n  [{i.get('severity', '')}] {i.get('type', '')}")
                  print(f"  Archivo: {i.get('component', '').replace('dualab:', '')} — Línea: {i.get('line', '?')}")
                  print(f"  Mensaje: {i.get('message', '')}")
          except Exception as e:
              print(f"No se pudieron leer los issues: {e}")

          try:
              hotspots = json.load(open("sonar-hotspots.json")).get("hotspots", [])
              print(f"\n SECURITY HOTSPOTS ({len(hotspots)} total):")
              for h in hotspots:
                  print(f"\n  Archivo: {h.get('component', '').replace('dualab:', '')} — Línea: {h.get('line', '?')}")
                  print(f"  Mensaje: {h.get('message', '')}")
          except Exception as e:
              print(f"No se pudieron leer los hotspots: {e}")

          print("\n" + "=" * 60)
          EOF

      - name: Upload SonarQube full report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-full-report
          path: |
            sonar-full-report.txt
            sonar-issues.json
            sonar-metrics.json
            sonar-hotspots.json

      # ─── 5. OWASP DEPENDENCY CHECK ─────────────────────────────────────────
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'microretos'
          path: '.'
          format: 'HTML'
          out: 'reports/dependency-check'
          args: >
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableRetired
            --enableExperimental
            --failOnCVSS 7
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/dependency-check/

      # ─── 6. NPM AUDIT ──────────────────────────────────────────────────────
      - name: NPM Audit (dependency vulnerabilities)
        run: |
          npm audit --json > npm-audit-report.json 2>&1 || true
          npm ls --depth 10 > npm-ls-depth.txt 2>&1 || true
          echo "=== NPM AUDIT SUMMARY ===" && npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Upload NPM audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-reports
          path: |
            npm-audit-report.json
            npm-ls-depth.txt

      # ─── 7. JOB SUMMARY ────────────────────────────────────────────────────
      - name: Write Job Summary
        if: always()
        run: |
          echo "## Security Static Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Herramienta | Categoría | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | Secretos expuestos | Completado |" >> $GITHUB_STEP_SUMMARY
          echo "| SonarQube | SAST / Calidad | Completado |" >> $GITHUB_STEP_SUMMARY
          echo "| OWASP Dependency Check | CVEs en dependencias | Completado |" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | Vulnerabilidades npm | Completado |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⬇ **Descarga los artefactos** en la sección _Artifacts_ de esta ejecución." >> $GITHUB_STEP_SUMMARY